name: Plum
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.6
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  Plum:
    type: application
    platform: iOS
    info:
      path: PlumApp/Info.plist
      properties:
        CFBundleDisplayName: Plum
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - plum
        UILaunchScreen: {}
    sources:
      - path: PlumApp
      - path: Sources/PlumDomain
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plum.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_SUPABASE_URL: $(SUPABASE_URL)
        INFOPLIST_KEY_SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
